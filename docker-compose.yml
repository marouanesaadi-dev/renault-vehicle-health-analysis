services:
  recall-provider:
    image: wiremock/wiremock:3.9.1
    ports: ["8090:8080"]
    volumes: ["./wiremock:/home/wiremock:ro"]
  vehicle-analysis-service:
    build:
      context: .
      dockerfile: vehicle-analysis-service/Dockerfile
    environment:
      RECALL_PROVIDER_URL: http://recall-provider:8080
    ports: ["8082:8082"]
    depends_on: [recall-provider]
    volumes: ["analysis-data:/app/data"]
  telemetry-service:
    build:
      context: .
      dockerfile: telemetry-service/Dockerfile
    environment:
      ANALYSIS_SERVICE_URL: http://vehicle-analysis-service:8082
    ports: ["8081:8081"]
    depends_on: [vehicle-analysis-service]
    volumes: ["telemetry-data:/app/data"]
volumes:
  telemetry-data:
  analysis-data:
